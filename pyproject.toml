[project]
name = "eagle-router"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.7.0",
    "transformers>=4.51.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
markers = [
    "integration: calls an external service (HuggingFace or OpenAI)",
    "openai: calls the paid OpenAI API (needs OPENAI_API_KEY)",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
