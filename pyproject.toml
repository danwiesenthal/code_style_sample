[project]
name = "eagle-router"
version = "0.1.0"
description = "Code style sample: a small, tested Python implementation of the EAGLE LLM router (Elo ratings plus embedding nearest neighbors)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.7.0",
    "transformers>=4.51.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.pytest]
testpaths = ["tests"]
# Unit tests only by default; pass -m to run integration tests
addopts = ["-m", "not integration"]
strict = true
markers = [
    "integration: calls an external service (HuggingFace or OpenAI)",
    "openai: calls the paid OpenAI API (needs OPENAI_API_KEY)",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes: unused imports, undefined names
    "I",  # import order
    "UP",  # current Python syntax
    "B",  # likely bugs
    "SIM",  # simpler code
    "C4",  # comprehensions
    "RUF",  # ruff's own checks
    "PT",  # pytest conventions
    "N",  # PEP 8 naming
    "D",  # docstrings
    "PTH",  # pathlib for file paths
]
ignore = [
    "D107",  # __init__ arguments are documented in the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# Immutable, so safe to use as default argument values
extend-immutable-calls = ["elo.RatingPair"]
