[project]
name = "eagle-router"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: calls an external service (HuggingFace or OpenAI)",
]
